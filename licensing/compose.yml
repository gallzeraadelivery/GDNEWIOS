services:
  licensing:
    build: .
    container_name: gdnewios-licensing
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./data:/data
    networks:
      edge:
        aliases:
          - gdnewios-licensing
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 1
networks:
  edge:
    external: true
    name: gdnew_web

